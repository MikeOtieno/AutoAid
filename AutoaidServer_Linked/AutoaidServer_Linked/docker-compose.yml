
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoaid
      POSTGRES_USER: autoaid
      POSTGRES_PASSWORD: autoaid
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: gunicorn autoaid.config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file: .env
    volumes:
      - ./autoaid:/app/autoaid
      - ./ml:/app/ml
      - media:/app/media
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A autoaid.config.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    volumes:
      - ./autoaid:/app/autoaid
      - ./ml:/app/ml
      - media:/app/media
      - models:/models
    depends_on:
      - db
      - redis

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A autoaid.config.celery_app beat --loglevel=INFO
    env_file: .env
    volumes:
      - ./autoaid:/app/autoaid
    depends_on:
      - redis

  nginx:
    image: nginx:1.27
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  pgdata:
  media:
  models:
